<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <style>
    .bg { fill: #0f1724; }
    .card { fill: #111827; rx: 12; ry: 12; stroke: #1f2937; }
    .image { fill: #0b1220; stroke: #374151; }
    .label { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 18px; }
    .muted { fill: #cbd5e1; font-size: 14px; }
    .badge { fill: #0ea5a4; font-weight: bold; }
    .overlay { fill: rgba(0,0,0,0.45); }
  </style>
  <rect class="bg" width="100%" height="100%" />

  <!-- Card -->
  <g transform="translate(80,40)">
    <rect class="card" width="640" height="400" />

    <!-- Primary image box (mock) -->
    <g transform="translate(16,16)">
      <rect class="image" width="608" height="272" rx="8" ry="8" />
      <rect x="0" y="220" width="608" height="60" class="overlay" rx="6" ry="6" />
      <text x="16" y="248" class="label">Hofladen Hauptbild (primary_image)</text>
      <text x="16" y="272" class="muted">Hintergrundbild: camera.hofladen_xyz_hauptbild</text>
    </g>

    <!-- Left overlay label -->
    <g transform="translate(32,40)">
      <rect x="0" y="0" width="220" height="36" rx="6" ry="6" fill="rgba(0,0,0,0.6)" />
      <text x="12" y="24" class="label">Geöffnet · Hofladen Müller</text>
    </g>

    <!-- Right badge (distance) -->
    <g transform="translate(520,48)">
      <rect x="0" y="0" width="96" height="36" rx="18" ry="18" fill="#0ea5a4" />
      <text x="48" y="24" text-anchor="middle" class="label">3.4 km</text>
    </g>

    <!-- Bottom area: attributes sample -->
    <g transform="translate(16,304)">
      <text class="label" x="0" y="20">Sortiment & Eigenschaften</text>
      <text class="muted" x="0" y="44">Kategorien: Gemüse, Milchprodukte</text>
      <text class="muted" x="0" y="64">Merkmale: Bio, eigener Anbau</text>
      <text class="muted" x="0" y="84">primary_image: https://example.com/hofbild.jpg</text>
    </g>

  </g>

  <!-- Footer note -->
  <text x="16" y="468" class="muted">Mockup: Lovelace Picture Elements example for HofKarte Unit 11</text>
</svg>
