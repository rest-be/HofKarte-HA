# Home-Assistant-Integration-Quality-Scale-Selbsteinschätzung für HofKarte.
#
# Ehrliche Einschätzung. Nicht erfüllte Kriterien sind mit "todo" markiert
# und im technischen Grund erläutert statt vorgetäuscht zu werden
# ("Kriterium konkret benennen, technischen Grund dokumentieren, keine
# Scheinimplementierung bauen"). "exempt" markiert Kriterien, die für
# HofKarte fachlich nicht zutreffen (z. B. keine Authentifizierung, kein
# Push-Discovery).
#
# HofKarte ist eine private HACS-Integration ohne Ambition auf Aufnahme
# in den Home-Assistant-Core-Repository-Prozess; die Einschätzung dient
# der ehrlichen Selbstprüfung, nicht einer formellen HA-Core-Einreichung.

rules:
  # --- Bronze --------------------------------------------------------------
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: |
      Lokale Icons (custom_components/hofkarte/brand/) sind vorhanden,
      aber nicht im zentralen home-assistant/brands-Repository
      eingereicht. Das erfordert einen öffentlichen PR-Review-Prozess bei
      einem separaten Projekt und ist für eine private, nicht im
      HACS-Default-Store gelistete Integration nicht zwingend. Kann bei
      Bedarf nachgeholt werden, sobald das Repository öffentlich
      gelistet werden soll.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: |
      Entities abonnieren keine Home-Assistant-Events direkt; sie
      reagieren ausschliesslich auf Coordinator-Updates
      (CoordinatorEntity-Mechanismus).
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: todo
    comment: |
      Der Coordinator wird aktuell unter hass.data[DOMAIN][entry.entry_id]
      abgelegt statt über das modernere entry.runtime_data (ConfigEntry[T]).
      Funktional gleichwertig, aber nicht die aktuell empfohlene
      Home-Assistant-Konvention. Eine Umstellung würde __init__.py sowie
      alle Plattform-Dateien betreffen (jede async_setup_entry-Funktion) -
      das ist laut dem Grundsatz "keine grundlegende
      Architekturänderung" bewusst zurückgestellt.
  test-before-configure:
    status: exempt
    comment: |
      Der Config Flow prüft keine externe Verbindung, da HofKarte keine
      externe Datenquelle hat (integrationsinterner Storage, siehe
      Architekturentscheid). Es gibt nichts, dessen Erreichbarkeit vor
      dem Speichern der Config Entry getestet werden müsste.
  test-before-setup: done
  unique-config-entry: done

  # --- Silver ----------------------------------------------------------------
  config-entry-unloading: done
  log-when-unavailable: done
  entity-unavailable: done
  action-exceptions: done
  reauthentication-flow:
    status: exempt
    comment: |
      HofKarte hat keine Authentifizierung (lokaler, integrationsinterner
      Storage, keine externe API).
  parallel-updates: done
  test-coverage: done
  integration-owner: done
  docs-installation-parameters: done
  docs-configuration-parameters: done

  # --- Gold --------------------------------------------------------------
  entity-translations:
    status: todo
    comment: |
      Entity-Namen ("Geöffnet", "Nächste Öffnung", ...) sind als
      _attr_name fest auf Deutsch gesetzt statt über eine
      translation_key-Infrastruktur lokalisiert. Bewusste, dokumentierte
      Vereinfachung: Zielgruppe ist ein deutschsprachiger Nutzer; eine
      vollständige Entity-Übersetzungsinfrastruktur nachzurüsten wäre für
      den aktuellen Entwicklungsstand unverhältnismässiger Aufwand ohne
      erkennbaren Nutzen.
  entity-device-class: done
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: |
      HofKarte hat keine automatische Geräteerkennung (keine physischen
      Geräte im Netzwerk).
  discovery:
    status: exempt
    comment: |
      Kein automatisches Discovery möglich oder sinnvoll – Hofläden sind
      keine im Netzwerk auffindbaren Geräte.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: |
      HofKarte verwaltet keine physischen Geräte unterschiedlicher
      Hersteller/Modelle, für die eine Kompatibilitätsliste sinnvoll wäre.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: todo
    comment: |
      Keine der Entities nutzt EntityCategory (z. B. diagnostic/config).
      Fachlich sind alle Entities primäre, für den Nutzer direkt
      relevante Informationen (Öffnungsstatus, Entfernung, Bild) - eine
      Kategorisierung als "diagnostic" oder "config" wäre nicht
      zutreffend. Nicht als "exempt" markiert, da eine erneute Prüfung
      bei künftigen Entity-Ergänzungen sinnvoll sein könnte.
  entity-disabled-by-default:
    status: todo
    comment: |
      Keine Entity ist standardmässig deaktiviert. Bei einer kleinen,
      bewusst kuratierten Entity-Anzahl (5 pro Hofladen, alle fachlich
      zentral) ist das aktuell nicht notwendig; könnte bei künftigem
      Ausbau (z. B. weitere Detail-Sensoren) relevant werden.
  exception-translations:
    status: todo
    comment: |
      Ausnahmen (HofladenValidationError, HofladenNotFoundError, etc.)
      verwenden feste deutsche Fehlermeldungen statt der
      Home-Assistant-Exception-Translation-Infrastruktur
      (translation_key/translation_placeholders). Bewusste Vereinfachung
      analog zu "entity-translations" - Zielgruppe ist einsprachig
      deutsch.
  icon-translations:
    status: exempt
    comment: |
      HofKarte nutzt keine eigenen, pro-State variierenden Icons, die
      eine Icon-Übersetzungsdatei rechtfertigen würden.
  reconfiguration-flow:
    status: todo
    comment: |
      Es gibt keinen Reconfigure-Schritt im Config Flow (z. B. um den
      Anzeigenamen nachträglich zu ändern). Da der Anzeigename das
      einzige Konfigurationsfeld ist und HofKarte Single-Instance ist,
      ist der praktische Nutzen gering; könnte bei Bedarf ergänzt werden.
  repair-issues:
    status: todo
    comment: |
      Es werden keine Repair-Issues erzeugt (z. B. bei dauerhaft
      fehlerhaften Hofladen-Datensätzen). Ungültige Datensätze werden
      aktuell nur geloggt und übersprungen (siehe coordinator.py),
      erscheinen aber nicht als sichtbares Repair-Issue im
      Home-Assistant-UI. Kandidat für eine künftige Erweiterung.
  stale-devices: done

  # --- Platinum --------------------------------------------------------------
  async-dependency: done
  inject-websession:
    status: done
    comment: |
      Seit Issue #8 ("Informationen aus Homepage") führt HofKarte
      erstmals eine eigene ausgehende HTTP-Anfrage aus (Abruf einer vom
      Benutzer angegebenen Website zur Informationsextraktion, siehe
      webseite_info.py). Die vorherige exempt-Begründung ("keine eigene
      HTTP-Client-Session") trifft damit nicht mehr zu. Der Abruf
      verwendet konsequent Home Assistants verwaltete Client-Session
      (homeassistant.helpers.aiohttp_client.async_get_clientsession),
      keine eigene, unverwaltete aiohttp.ClientSession - das Kriterium
      gilt damit als erfüllt. Seit Issue #10 ("Erweiterung OpenStreetMap
      zu #8") führt eine zweite eigene ausgehende HTTP-Anfrage
      denselben Weg (Abruf der OpenStreetMap-Overpass-API, siehe
      osm_info.py) - ebenfalls über dieselbe verwaltete Client-Session,
      keine zusätzliche, unverwaltete Session. Die Bildanzeige selbst
      läuft weiterhin vollständig über Home Assistants eigene
      ImageEntity-Infrastruktur, ohne eigenen HTTP-Client.
  strict-typing: done
